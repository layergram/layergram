name: layergram
description: Official open-source Layergram app for local encrypted steganographic messaging.
homepage: https://layergram.app
publish_to: 'none'
version: 1.3.0+19

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.0.0
  share_plus: ^12.0.1
  receive_sharing_intent: ^1.8.1
  flutter_riverpod: ^2.6.1
  cryptography: ^2.7.0
  crypto: ^3.0.6
  bip39: ^1.0.6
  base32: ^2.1.3
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  uuid: ^4.5.1
  package_info_plus: ^9.0.0
  characters: ^1.4.1
  easy_localization: ^3.0.7
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.2
  dotted_border: ^3.1.0
  flutter_linkify: ^6.0.0
  archive: ^4.0.0
  android_intent_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.1
  msix: ^3.16.13
  mockito: ^5.4.4
  build_runner: ^2.4.9

msix_config:
  display_name: Layergram
  identity_name: Layergram.Layergram
  publisher_display_name: Layergram
  publisher: CN=E07E4A09-C69A-4AFD-BF84-5CBED0ED1C27
  protocol_activation: layergram
  install_certificate: false
  store: true
  logo_path: assets/icons/app_icon.png
  logo_background_color: transparent

flutter_launcher_icons:
  image_path: assets/icons/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/app_icon.png
  macos:
    generate: true
    image_path: assets/icons/app_icon.png
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
  linux:
    generate: true
    image_path: assets/icons/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icons/app_icon.png
