[package]
name = "layergram-scka-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"

[dependencies.layergram-scka]
path = ".."
features = ["candidate-ffi"]

[[bin]]
name = "ffi_state_validate"
path = "fuzz_targets/ffi_state_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_receive"
path = "fuzz_targets/ffi_receive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_send"
path = "fuzz_targets/ffi_send.rs"
test = false
doc = false
bench = false
