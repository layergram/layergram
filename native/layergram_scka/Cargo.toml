[package]
name = "layergram-scka"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
publish = false
description = "Inactive Layergram ML-KEM Braid revision-1 native ABI scaffold"

[lib]
name = "layergram_scka"
