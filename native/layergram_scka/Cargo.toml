[package]
name = "layergram-scka"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
publish = false
description = "Inactive Layergram ML-KEM Braid revision-1 native ABI scaffold"

[lib]
name = "layergram_scka"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["incremental", "mlkem768"] }
zeroize = { version = "=1.8.1", default-features = false }

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
