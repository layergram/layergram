name: KeyboardCustodyFixture
options:
  bundleIdPrefix: app.layergram.keyboardvalidation.qa
  deploymentTarget:
    iOS: '17.0'
settings:
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: '5.0'
  ENABLE_TESTABILITY: YES
packages:
  SystemKeyboardCore:
    path: ../../../ios/SystemKeyboardCore
targets:
  CustodyFixture:
    type: application
    platform: iOS
    sources: [App.swift]
    entitlements:
      path: CustodyFixture.entitlements
      properties:
        com.apple.security.application-groups: [group.app.layergram.keyboardvalidation.qa]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.layergram.keyboardvalidation.qa
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  CustodyFixtureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LifecycleTests.swift
      - ../../../ios/SystemKeyboardCore/Tests/SystemKeyboardCoreTests
    dependencies:
      - target: CustodyFixture
      - package: SystemKeyboardCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.layergram.keyboardvalidation.qa.tests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  CustodyFixture:
    build:
      targets:
        CustodyFixture: all
        CustodyFixtureTests: [test]
    test:
      targets: [CustodyFixtureTests]
