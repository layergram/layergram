name: Dependency vulnerability scanning

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-vulnerability-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-scan:
    name: Full dependency scan
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5 # v2.5.1
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  pull-request-scan:
    name: Pull request dependency scan
    if: >-
      ${{ github.event_name == 'pull_request' ||
          github.event_name == 'merge_group' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@880d9b542cc66d36d91d51b3fbcc038f5f28cfc5 # v2.5.1
    with:
      scan-args: |-
        --include-git-root
        -r
