name: Dependency vulnerability scanning

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-vulnerability-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-android-runtime-lock:
    name: Prepare Android release runtime lock
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the scanned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p osv-input
          {
            head -n 3 android/app/gradle.lockfile
            awk -F= '$2 ~ /(^|,)releaseRuntimeClasspath(,|$)/' \
              android/app/gradle.lockfile
          } > osv-input/gradle.lockfile
          test "$(wc -l < osv-input/gradle.lockfile)" -gt 100

      - name: Upload the filtered runtime lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-runtime-lock
          path: osv-input/gradle.lockfile
          if-no-files-found: error
          retention-days: 1

  full-scan:
    name: Full dependency scan
    needs: prepare-android-runtime-lock
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
    with:
      download-artifact: android-release-runtime-lock
      scan-args: |-
        --lockfile=pubspec.lock
        --lockfile=native/layergram_scka/Cargo.lock
        --lockfile=native/layergram_scka/fuzz/Cargo.lock
        --lockfile=requirements.txt:tool/pq/requirements-print.txt
        --lockfile=gradle.lockfile

  pull-request-scan:
    name: Pull request dependency scan
    needs: prepare-android-runtime-lock
    if: >-
      ${{ github.event_name == 'pull_request' ||
          github.event_name == 'merge_group' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
    with:
      download-artifact: android-release-runtime-lock
      scan-args: |-
        --lockfile=pubspec.lock
        --lockfile=native/layergram_scka/Cargo.lock
        --lockfile=native/layergram_scka/fuzz/Cargo.lock
        --lockfile=requirements.txt:tool/pq/requirements-print.txt
        --lockfile=gradle.lockfile
