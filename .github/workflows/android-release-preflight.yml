name: Android release preflight

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Release APK dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: 3.41.1

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Install the pinned Rust toolchain and Android targets
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          rustup override set 1.87.0
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Fetch the locked protocol backend dependencies
        run: cargo fetch --locked --manifest-path native/layergram_scka/Cargo.toml

      - name: Package the functional Android protocol backend
        run: tool/pq/prepare_scka_packaged_android.sh

      - name: Build the functional non-distribution release APK
        env:
          ORG_GRADLE_PROJECT_layergramSckaCandidatePackage: "true"
        run: flutter build apk --release --target lib/main.dart

      - name: Require every supported protocol backend ABI
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk > apk-contents.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -F "lib/$abi/liblayergram_scka.so" apk-contents.txt
          done
