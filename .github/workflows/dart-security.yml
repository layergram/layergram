name: Dart security analysis

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyzer and security invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.41.1

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Run the full Dart analyzer
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verify source-level security invariants
        run: flutter test test/security

      - name: Verify privacy and app-lock gates
        run: >-
          flutter test
          test/ui/privacy_shield_overlay_test.dart
          test/app_privacy_lifecycle_test.dart
          test/features/security/app_lock_gate_test.dart

      - name: Verify release version and source-build contracts
        run: >-
          flutter test
          test/core/platform_version_contract_test.dart
          test/core/source_build_contract_test.dart
