version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:19"
      timezone: Atlantic/Canary
    open-pull-requests-limit: 3
    groups:
      workflow-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:29"
      timezone: Atlantic/Canary
    open-pull-requests-limit: 3
    groups:
      dart-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /native/layergram_scka
    schedule:
      interval: weekly
      day: monday
      time: "03:39"
      timezone: Atlantic/Canary
    open-pull-requests-limit: 3
    groups:
      crypto-patches:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: cargo
    directory: /native/layergram_scka/fuzz
    schedule:
      interval: weekly
      day: monday
      time: "03:49"
      timezone: Atlantic/Canary
    open-pull-requests-limit: 3
    groups:
      fuzz-patches:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "04:09"
      timezone: Atlantic/Canary
    open-pull-requests-limit: 3
    groups:
      android-patches:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: pip
    directory: /tool/pq
    schedule:
      interval: weekly
      day: monday
      time: "04:19"
      timezone: Atlantic/Canary
    open-pull-requests-limit: 3
    groups:
      python-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
